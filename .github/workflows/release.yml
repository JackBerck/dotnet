name: Release Packaging

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build & Publish Self-Contained Win-x64
      run: |
        dotnet publish src/Dotnet.App/Dotnet.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o bin/publish

    - name: Build Portable Archive & Checksums
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        $zipName = "Dotnet-v$version-win-x64-portable.zip"
        Compress-Archive -Path "bin/publish/*" -DestinationPath $zipName
        $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash
        "$hash  $zipName" | Out-File -FilePath SHA256SUMS.txt -Encoding utf8

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Dotnet-*.zip
          SHA256SUMS.txt
        generate_release_notes: true
