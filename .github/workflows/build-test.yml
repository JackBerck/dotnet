name: Build and Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore Dotnet.slnx

    - name: Build Solution
      run: dotnet build Dotnet.slnx --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test Dotnet.slnx --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
